name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and lint
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check whitespace
        run: git diff-tree --check --no-commit-id --root -r HEAD

      - name: Lint plists
        run: |
          plutil -lint \
            Ember/Info.plist \
            EmberShareExtension/Info.plist \
            EmberWidget/Info.plist \
            Ember/PrivacyInfo.xcprivacy \
            Ember/Ember.entitlements \
            EmberWidgetExtension.entitlements

      - name: Build app
        run: |
          xcodebuild -quiet \
            -project Ember.xcodeproj \
            -scheme Ember \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/EmberDerivedData-CI \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build tests
        run: |
          xcodebuild -quiet \
            build-for-testing \
            -project Ember.xcodeproj \
            -scheme Ember \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/EmberDerivedData-CI \
            CODE_SIGNING_ALLOWED=NO

      - name: Run focused unit tests
        continue-on-error: true
        run: |
          set -euo pipefail
          DESTINATION="$(xcodebuild -showdestinations -project Ember.xcodeproj -scheme Ember | sed -n 's/^[[:space:]]*{ platform:iOS Simulator.*id:\([^,]*\),.*name:iPhone.*$/platform=iOS Simulator,id=\1/p' | head -n 1)"
          if [ -z "$DESTINATION" ]; then
            echo "No compatible iPhone simulator destination found."
            exit 1
          fi
          xcodebuild -quiet \
            test \
            -project Ember.xcodeproj \
            -scheme Ember \
            -destination "$DESTINATION" \
            -derivedDataPath /tmp/EmberDerivedData-CI \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:EmberTests
